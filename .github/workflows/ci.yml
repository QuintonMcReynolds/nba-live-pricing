name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[kafka,dev]"
      - run: ruff check .
      - name: Unit tests + model lock (fails on unreviewed config changes)
        run: pytest -q
      - name: Start Redpanda (Kafka API)
        run: |
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.2.7 \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
            --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
          for i in $(seq 1 30); do docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && break; sleep 2; done
          docker exec redpanda rpk cluster health
      - name: Kafka integration test (events in, prices out through a real broker)
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: pytest -q tests/test_kafka_integration.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nba-live-pricing .
      - name: Smoke-test the container
        run: |
          docker run -d --name engine -p 8000:8000 nba-live-pricing
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          curl -fs localhost:8000/metrics
      - name: Container logs
        if: always()
        run: docker logs engine || true
